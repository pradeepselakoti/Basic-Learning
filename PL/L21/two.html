<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid black;
            background-color: beige;
            display: flex;
            flex-direction: row;
            width: 500px;
             margin: 10px;
            padding: 2px;
        }
        .boxleft{
            background-color: aqua;
            border: 1px solid blue;
            width: 47%;
            margin: 3px;
            padding: 2px;
            display: flex;
            flex-direction: column;
        }

        .boxright{
            background-color: yellow;
            border: 1px solid brown;
            width: 47%;
             margin: 3px;
            padding: 2px;
        }
        p{
            border: 1px solid red;
        }
        img{
            height: 200px;
        }
       @media  (max-width:640px) {
        .container{
            flex-direction: column;
        }
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>
        <div class="boxright">
            <img src="images.jpg"/>
        </div>
    </div>
</body>
</html>
